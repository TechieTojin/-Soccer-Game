[pytest]
# Only the original application code is tested. The inherited research
# pipeline (soccer3d/, utils/, demo/) is excluded: it needs Detectron,
# OpenPose, CUDA and compiled extensions, and utils/nms/pycocotools/coco.py
# is still Python 2 source that cannot even be parsed by Python 3.
testpaths = tests
norecursedirs = soccer3d utils demo barcelona .git
addopts = -q
