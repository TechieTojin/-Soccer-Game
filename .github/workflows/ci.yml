# CI for the Soccer AR/VR Experience application code.
#
# Scope note: this deliberately does NOT build or test the inherited
# "Soccer on Your Tabletop" research pipeline (soccer3d/, utils/, demo/).
# That code needs Detectron, OpenPose, CUDA and compiled C++/Cython
# extensions, and one of its vendored files is still Python 2 source. It is
# excluded in ruff.toml and pytest.ini.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    env:
      # The tests run headless: SDL uses its dummy drivers so pygame never
      # needs a display, and no webcam is opened.
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (application code only)
        run: python -m ruff check .

      - name: Byte-compile the application code
        run: >
          python -m compileall -q
          soccer_core soccer_gl.py soccer_game.py ar_soccer_experience.py
          vr_soccer_experience.py soccer3d_viewer.py run_windows_version.py
          modern_interface.py tools tests

      - name: Run tests
        run: python -m pytest -v

      - name: Headless smoke test (2D match)
        run: python tests/smoke_2d.py --frames 600
